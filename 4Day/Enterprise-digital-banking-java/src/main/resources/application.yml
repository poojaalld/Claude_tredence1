spring:
  application:
    name: enterprise-digital-banking
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/digital_banking}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-every-environment}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
